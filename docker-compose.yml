# Cerebro — bundled stack (app + Postgres + Redis)
# Docker Desktop:  docker compose up -d
# Portainer:       Stacks → Add stack → paste this file, set env vars
#
# The app image builds the React UI and serves it from the NestJS server,
# so only one app container is exposed.

services:
  app:
    image: ${CEREBRO_IMAGE:-cerebro:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Injected into the UI/version screen at build time.
        GIT_SHA: ${GIT_SHA:-dev}
        # signal-cli version bundled for the Signal notification channel.
        SIGNAL_CLI_VERSION: ${SIGNAL_CLI_VERSION:-0.14.7}
    container_name: cerebro-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DATABASE_URL: ${DATABASE_URL:-postgresql://cerebro:cerebro_change_me@db:5432/cerebro?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Persistent home for signal-cli account state (--data-dir; see volume below).
      SIGNAL_CLI_DATA_DIR: /data/signal
      # Fabric RDP: where the app reaches the guacd sidecar. FABRIC_GUACD_CALLBACK_HOST
      # is the address guacd dials to reach the app's ephemeral RDP forward — leave it
      # unset and the app auto-detects its own Docker-network IP (no DNS needed); set it
      # only to override with a specific hostname.
      GUACD_HOST: ${GUACD_HOST:-guacd}
      GUACD_PORT: ${GUACD_PORT:-4822}
      FABRIC_GUACD_CALLBACK_HOST: ${FABRIC_GUACD_CALLBACK_HOST:-}
      # Fabric scaling knobs. Raise the heartbeat interval to cut per-agent liveness
      # DB writes when many agents are enrolled (agents adopt it on their next hello);
      # FABRIC_POLL_MS slows how often the /fabric screen refreshes the agent list.
      FABRIC_HEARTBEAT_MS: ${FABRIC_HEARTBEAT_MS:-15000}
      FABRIC_MISSED_BEATS_OFFLINE: ${FABRIC_MISSED_BEATS_OFFLINE:-3}
      FABRIC_POLL_MS: ${FABRIC_POLL_MS:-10000}
      # Fabric Waypoint Remote Browser (remote browser). The app launches ONE ephemeral
      # browser container per session via the Docker socket (mounted below), and the
      # browser dials back to this app's per-session SOCKS bridge at
      # REMOTE_BROWSER_CALLBACK_HOST. Build the image once:
      #   docker build -t cerebro-remote-browser:latest docker/remote-browser
      # REMOTE_BROWSER_NETWORK MUST be this compose project's network (so the app can reach
      # the browser's VNC and the browser can reach REMOTE_BROWSER_CALLBACK_HOST) — usually
      # "<project>_default", e.g. automation-dashboard_default. See docs/fabric-waypoints.md.
      REMOTE_BROWSER_IMAGE: ${REMOTE_BROWSER_IMAGE:-cerebro-remote-browser:latest}
      REMOTE_BROWSER_NETWORK: ${REMOTE_BROWSER_NETWORK:-}
      REMOTE_BROWSER_CALLBACK_HOST: ${REMOTE_BROWSER_CALLBACK_HOST:-cerebro-app}
      REMOTE_BROWSER_GEOMETRY: ${REMOTE_BROWSER_GEOMETRY:-1280x800}
    volumes:
      - cerebro_signal:/data/signal
      # Fabric RDP session recordings — shared with the guacd sidecar (guacd writes,
      # the app serves them back for playback). See docs/fabric-remote-access.md.
      - cerebro_fabric_recordings:/recordings
      # Fabric Remote Browser: the app spawns ephemeral remote-browser containers via the
      # host Docker socket. Omit this mount to disable Remote Browser. See docs/fabric-waypoints.md.
      - /var/run/docker.sock:/var/run/docker.sock
    # ICMP for the uptime monitor's Ping probe (system `ping` needs a raw socket).
    cap_add:
      - NET_RAW
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: cerebro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cerebro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cerebro_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-cerebro}
    volumes:
      - cerebro_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cerebro} -d ${POSTGRES_DB:-cerebro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cerebro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cerebro_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Guacamole daemon — renders RDP (and VNC) to the browser for Fabric.
  # Only used when opening an RDP session; the app talks to it at guacd:4822 and
  # points it back at a per-session ephemeral forward that rides the agent tunnel.
  # See docs/fabric-remote-access.md (Phase 4).
  guacd:
    image: guacamole/guacd:1.5.5
    container_name: cerebro-guacd
    restart: unless-stopped
    volumes:
      # Same volume as the app — guacd writes recordings here for later playback.
      - cerebro_fabric_recordings:/recordings

volumes:
  cerebro_db:
  cerebro_redis:
  cerebro_signal:
  cerebro_fabric_recordings:
